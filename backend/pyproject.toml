[project]
name = "macmine-lab"
version = "0.1.0"
description = "Local Apple Silicon RandomX/Monero mining laboratory — educational, transparent, local-only."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macmine_lab"]
