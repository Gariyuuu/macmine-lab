[project]
name = "macmine-lab"
version = "0.7.0"
description = "Local Apple Silicon RandomX/Monero mining laboratory — educational, transparent, local-only."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "websockets>=13.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macmine_lab"]
